[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signate-wandb-sync"
version = "0.1.3"
description = "A CLI tool to record SIGNATE competition scores to W&B"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "yasunorim" },
]
keywords = ["signate", "wandb", "weights-and-biases", "machine-learning", "competition", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
signate-wandb-sync = "signate_wandb_sync.cli:main"

[project.urls]
Homepage = "https://github.com/yasumorishima/signate-wandb-sync"
Repository = "https://github.com/yasumorishima/signate-wandb-sync"

[tool.hatch.build.targets.wheel]
packages = ["src/signate_wandb_sync"]
